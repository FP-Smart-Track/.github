name: 🐛 Reporte de Bug
description: Reporta un error o comportamiento inesperado en el sistema.
title: "[BUG] "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar este bug. Por favor, proporciona toda la información posible para ayudarnos a reproducirlo y solucionarlo.

  - type: textarea
    id: description
    attributes:
      label: Descripción del bug
      description: Una descripción clara y concisa del problema.
      placeholder: "Al hacer X sucede Y en lugar de Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Pasos detallados para reproducir el comportamiento.
      placeholder: |
        1. Ir a '...'
        2. Hacer clic en '...'
        3. Observar el error

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      description: ¿Qué esperabas que ocurriera?
      placeholder: "Debería haberse mostrado..."

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: ¿Qué ocurre realmente?
      placeholder: "En cambio, se muestra..."

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack trace
      description: Pega aquí cualquier mensaje de error o traza relevante.
      render: shell

  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      description: ¿Cuál es el impacto de este bug?
      options:
        - Crítico (el sistema no funciona)
        - Alto (funcionalidad principal afectada)
        - Medio (funcionalidad secundaria afectada)
        - Bajo (problema estético o menor)

  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Indica el entorno donde ocurre el bug (ej. producción, staging, local).
      placeholder: "Producción / Staging / Local"

  - type: textarea
    id: additional
    attributes:
      label: Información adicional
      description: Capturas de pantalla, versiones, configuraciones relevantes, etc.
